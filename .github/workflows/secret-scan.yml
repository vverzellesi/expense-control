name: Secret scan

# Roda em todo push e pull request, sem nenhum secret do repositório.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Nenhum arquivo rastreado sob personal/
        run: |
          count="$(git ls-files -- personal | wc -l)"
          if [ "$count" -ne 0 ]; then
            echo "::error::$count arquivo(s) rastreado(s) sob personal/. Essa pasta é só local (relatórios com dados pessoais)."
            exit 1
          fi

      - name: Instalar gitleaks (versão fixa, checksum conferido)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      # Sem --verbose: o log público mostra só a contagem, nunca o achado.
      # Para ver os detalhes, rode localmente: gitleaks git --redact -v .
      - name: Varrer histórico com gitleaks
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1 .
